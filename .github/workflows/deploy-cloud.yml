name: Deploy cloud

# Sustain Cloud deploys from main to the owner's host once the repository variable SUSTAIN_DEPLOY is
# "true" and the secret SUSTAIN_DEPLOY_HOOK holds the host's deploy hook. The app applies its
# database migrations when it starts, before it serves requests.
on:
  push:
    branches: [main]

jobs:
  deploy:
    if: vars.SUSTAIN_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run -w cloud test
      - run: npm run -w cloud build
      - name: Deploy
        env:
          DEPLOY_HOOK: ${{ secrets.SUSTAIN_DEPLOY_HOOK }}
        run: curl -fsS -X POST "$DEPLOY_HOOK"
