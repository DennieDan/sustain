name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # A tag with a hyphen, such as v0.3.0-rc.1, is a dry run: everything is built and kept as a
      # workflow artifact, and nothing is released or published.
      PRERELEASE: ${{ contains(github.ref_name, '-') }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run check
      - run: npm run package
      - run: npm run build:release
      - run: npm run action
      - run: git diff --exit-code action/dist skills
      - name: Assemble the release files
        run: |
          mkdir -p release/files
          cp sustain-*.vsix release/files/
          (cd release/plugin && zip -qr ../files/sustain-skills.zip skills .claude-plugin)
          cp action/dist/index.js release/files/sustain-action.js
          (cd release/files && sha256sum * > SHA256SUMS)
          echo "LICENSED=$(node -p 'require("./package.json").license ? "true" : "false"')" >> "$GITHUB_ENV"
      - name: Keep the dry run's files
        if: env.PRERELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run
          path: release/files
      - name: GitHub release
        if: env.PRERELEASE == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/files/* --title "Sustain $GITHUB_REF_NAME" --generate-notes
      - name: Open VSX
        if: env.PRERELEASE == 'false' && env.OVSX_PAT != '' && env.LICENSED == 'true'
        run: npx --yes ovsx@1.3.0 publish release/files/sustain-*.vsix -p "$OVSX_PAT"
      - name: Sign in to Microsoft Entra ID for the Marketplace
        if: env.PRERELEASE == 'false' && env.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: VS Code Marketplace
        if: env.PRERELEASE == 'false' && env.AZURE_CLIENT_ID != ''
        run: npx vsce publish --packagePath release/files/sustain-*.vsix --azure-credential
